<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اسما عشق بی‌پایان 💖</title>
    <style>
        /* === RESET & BASE === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Tahoma', system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0a0a0f;
            background-image: 
                radial-gradient(circle at 20% 30%, #1a0b1a 0%, #0d0407 80%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        /* === کانتینر اصلی با تم نئونی === */
        .romantic-container {
            max-width: 700px;
            width: 100%;
            background: rgba(8, 5, 12, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 20, 80, 0.2);
            border-radius: 32px 8px 32px 8px;
            padding: 2.2rem 2rem;
            box-shadow: 
                0 0 40px rgba(255, 0, 80, 0.1),
                0 0 80px rgba(200, 0, 255, 0.05),
                inset 0 0 60px rgba(255, 20, 80, 0.03);
            position: relative;
            z-index: 1;
        }

        /* === هدر نئونی === */
        .heart-glow {
            text-align: center;
            font-size: 2.4rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ff4d7a, #ff1a5c, #cc00ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 
                0 0 30px #ff2a66,
                0 0 60px #ff0044;
            letter-spacing: 2px;
            margin-bottom: 20px;
            animation: pulseGlow 3s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { text-shadow: 0 0 20px #ff2a66, 0 0 40px #ff0044; }
            100% { text-shadow: 0 0 40px #ff66a0, 0 0 80px #ff3377, 0 0 120px #cc44ff; }
        }

        /* === باکس سوالات === */
        .question-box {
            background: rgba(0, 0, 0, 0.35);
            border-radius: 28px 6px 28px 6px;
            padding: 28px 22px;
            margin: 15px 0;
            border: 1px solid rgba(255, 80, 150, 0.12);
            box-shadow: inset 0 0 30px rgba(255, 0, 80, 0.03);
            min-height: 180px;
        }

        .question-box h2 {
            color: #ffb3d1;
            text-shadow: 0 0 20px #ff336688;
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 50, 100, 0.1);
            padding-bottom: 12px;
        }

        /* === دکمه‌ها === */
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
            margin: 22px 0 8px;
        }

        .btn {
            padding: 13px 28px;
            border: none;
            border-radius: 50px;
            font-size: 1.15rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #1a1118;
            color: #ccc;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .btn:hover { transform: translateY(-2px); }

        /* بله سبز */
        .btn-yes {
            background: #00c853;
            color: #fff;
            border-color: #00e676;
            box-shadow: 0 0 25px rgba(0, 200, 80, 0.25);
        }
        .btn-yes:hover { background: #00e676; box-shadow: 0 0 40px rgba(0, 200, 80, 0.35); }

        /* خیر قرمز کمرنگ با قفل */
        .btn-no {
            background: #b71c1c;
            color: #fff;
            border-color: #f44336;
            box-shadow: 0 0 25px rgba(200, 0, 0, 0.2);
            opacity: 0.7;
        }
        .btn-no:hover { background: #d32f2f; opacity: 0.9; }
        .btn-no::after { content: " 🔒"; font-size: 0.9rem; }

        /* قفل عمومی */
        .btn-locked {
            background: #1a0e12;
            color: #885566;
            border: 1px solid #3a1a2a;
            opacity: 0.8;
            cursor: pointer;
        }
        .btn-locked::after { content: " 🔒"; font-size: 0.9rem; }
        .btn-locked:hover { opacity: 1; background: #2a1420; border-color: #5a2a3a; }

        /* برگشت قرمز */
        .btn-back {
            background: #b71c1c;
            color: #fff;
            padding: 10px 28px;
            border-radius: 40px;
            font-size: 1rem;
            border: 1px solid #f44336;
            margin-top: 15px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(200, 0, 0, 0.15);
            font-weight: 700;
            transition: 0.2s;
        }
        .btn-back:hover { background: #d32f2f; transform: scale(1.03); }

        /* === پاپ‌آپ === */
        .popup-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .popup-card {
            background: #120a10;
            border: 1px solid #ff336688;
            border-radius: 28px 6px 28px 6px;
            padding: 30px 28px;
            max-width: 400px;
            width: 92%;
            box-shadow: 0 0 60px rgba(255, 0, 80, 0.1);
            text-align: center;
            color: #ffb3c6;
            font-size: 1.2rem;
        }

        .popup-card .close-btn {
            background: #b71c1c;
            border: 1px solid #f44336;
            color: #fff;
            padding: 10px 30px;
            border-radius: 40px;
            margin-top: 20px;
            font-weight: 700;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
        }
        .popup-card .close-btn:hover { background: #d32f2f; }

        /* === قلب بزرگ === */
        .big-heart {
            font-size: 5rem;
            animation: heartBeat 0.5s infinite alternate;
            display: block;
            margin: 10px auto;
            filter: drop-shadow(0 0 30px #ff0044);
        }
        @keyframes heartBeat {
            0% { transform: scale(1); }
            100% { transform: scale(1.25); }
        }

        /* === بخش نهایی === */
        .final-section {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 24px 6px 24px 6px;
            padding: 25px 20px;
            margin: 10px 0;
            border: 1px solid #ffaa3366;
        }

        .money-emoji { font-size: 4rem; filter: drop-shadow(0 0 25px #ffaa00); }
        .strike-line { text-decoration: line-through; color: #777; font-size: 1.7rem; opacity: 0.7; }
        .big-green { font-size: 3rem; color: #00e676; font-weight: 900; text-shadow: 0 0 40px #00e67688; }

        /* دکمه این رو حتما بخون */
        .btn-must-read {
            display: inline-block;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: #fff;
            padding: 14px 35px;
            border-radius: 60px;
            text-decoration: none;
            font-weight: 800;
            font-size: 1.2rem;
            margin: 20px 0 10px;
            box-shadow: 0 0 40px rgba(238, 90, 36, 0.4);
            transition: 0.3s;
            border: 2px solid rgba(255,255,255,0.15);
            cursor: pointer;
            animation: pulseButton 2s infinite;
        }
        .btn-must-read:hover { 
            transform: scale(1.06); 
            box-shadow: 0 0 60px rgba(238, 90, 36, 0.6);
        }
        @keyframes pulseButton {
            0% { box-shadow: 0 0 40px rgba(238, 90, 36, 0.4); }
            50% { box-shadow: 0 0 70px rgba(238, 90, 36, 0.7), 0 0 100px rgba(238, 90, 36, 0.3); }
            100% { box-shadow: 0 0 40px rgba(238, 90, 36, 0.4); }
        }

        /* استایل صفحه عکس */
        .photo-page {
            text-align: center;
            padding: 20px 0;
        }
        .photo-frame {
            display: inline-block;
            position: relative;
            border-radius: 20px;
            padding: 8px;
            background: linear-gradient(135deg, #ff0066, #ff00cc, #ff0066);
            box-shadow: 0 0 60px rgba(255, 0, 100, 0.5), 0 0 120px rgba(255, 0, 200, 0.2);
            animation: frameGlow 3s infinite alternate;
        }
        @keyframes frameGlow {
            0% { box-shadow: 0 0 40px rgba(255, 0, 100, 0.4), 0 0 80px rgba(255, 0, 200, 0.1); }
            100% { box-shadow: 0 0 80px rgba(255, 0, 100, 0.8), 0 0 150px rgba(255, 0, 200, 0.3); }
        }
        .photo-frame img {
            display: block;
            max-width: 100%;
            height: auto;
            border-radius: 16px;
            border: 3px solid rgba(255,255,255,0.1);
            max-height: 500px;
            object-fit: contain;
        }
        .heart-decoration {
            position: absolute;
            font-size: 2rem;
            animation: floatHeart 2s infinite alternate;
            pointer-events: none;
        }
        .heart-decoration:nth-child(2) { top: -10px; left: -10px; animation-delay: 0.3s; font-size: 2.5rem; }
        .heart-decoration:nth-child(3) { bottom: -10px; right: -10px; animation-delay: 0.6s; font-size: 2rem; }
        .heart-decoration:nth-child(4) { top: -10px; right: -10px; animation-delay: 0.9s; font-size: 1.8rem; }
        .heart-decoration:nth-child(5) { bottom: -10px; left: -10px; animation-delay: 1.2s; font-size: 2.2rem; }
        @keyframes floatHeart {
            0% { transform: scale(0.8) rotate(-5deg); opacity: 0.7; }
            100% { transform: scale(1.2) rotate(5deg); opacity: 1; }
        }

        .love-message {
            color: #ffb3d1;
            font-size: 1.4rem;
            line-height: 2.8rem;
            margin-top: 25px;
            padding: 25px 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            border: 1px solid rgba(255, 50, 100, 0.15);
            text-shadow: 0 0 30px rgba(255, 50, 100, 0.2);
            text-align: center;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .love-message .highlight {
            color: #ff6b9d;
        }

        @media (max-width: 520px) {
            .romantic-container { padding: 1.2rem 1rem; }
            .btn { padding: 10px 16px; font-size: 0.95rem; }
            .heart-glow { font-size: 1.8rem; }
            .question-box h2 { font-size: 1.3rem; }
            .popup-card { padding: 22px 16px; font-size: 1rem; }
            .love-message { font-size: 1.1rem; line-height: 2.2rem; }
            .btn-must-read { padding: 12px 25px; font-size: 1rem; }
        }
    </style>
</head>
<body>

<div class="romantic-container" id="appContainer">
    <div class="heart-glow">✨Love You ✨</div>
    <div id="dynamicContent" class="question-box">
        <!-- محتوای جاوااسکریپت -->
    </div>
</div>

<script>
    (function() {
        // === وضعیت ===
        const state = {
            currentStep: 0,
            noClickCount: 0,
            weddingLockCount: 0,
            dateLockCount: 0,
            answers: [],
        };

        const contentEl = document.getElementById('dynamicContent');

        // === داده سوالات ===
        const questions = [
            {
                title: "💖 زن آیندم میشی اسما؟  💖",
                type: 'yesno',
                yesLabel: 'بله 🥰',
                noLabel: 'خیر 🤥',
                noLocked: false,
                lockType: 'no'
            },
            {
                title: "🌙 ماه عسل میخوای یا عروسی خوشگله ؟ 👰‍♀️",
                type: 'twoOptions',
                opt1: 'ماه عسل 🌙',
                opt2: 'عروسی 👰‍♀️',
                locked: 'opt2',
                lockType: 'wedding'
            },
            {
                title: "💕 میای بریم دیت بعداااا؟ 💕",
                type: 'yesno',
                yesLabel: 'بله 💘',
                noLabel: 'خیر 🙈',
                noLocked: true,
                lockType: 'date'
            },
            {
                title: "🧁 چی بخوریم حالا؟ 🧁",
                type: 'multiSelect',
                options: ['کیک 🍰', 'قهوه ☕', 'آب 🚰', 'شیرینی 🍩'],
                activeIndex: 2,
                errorMsg: '⚠️ اینترنت متصل نیست فقط برای آب متصل است 🚰',
                lockType: 'food'
            },
            {
                title: "📍 کجا بریم دور دور؟ 📍",
                type: 'multiSelect',
                options: ['کافه ☕', 'رستوران 🍽️', 'بستنی فروشی 🍦', 'پیاده روی توی پارک 🌳'],
                activeIndex: 3,
                errorMsg: '🚶 پیاده برای سلامتیت بهتره ها 🫠🙂',
                lockType: 'place'
            },
            {
                title: "📅 چه تاریخی بریم بیرون؟!؟ 📅",
                type: 'datePicker',
                option1: 'من انتخاب کنم 🙋‍♂️',
                option2: 'تو انتخاب کنی 🌸',
                active: 'option2',
                lockType: 'datepicker'
            },
        ];

        // === رندر سوال ===
        function renderQuestion(step) {
            if (step >= questions.length) {
                renderFinal();
                return;
            }
            const q = questions[step];
            let html = `<div><h2>${q.title}</h2></div>`;

            if (q.type === 'yesno') {
                const isNoLocked = q.noLocked || false;
                html += `<div class="btn-group">`;
                html += `<button class="btn btn-yes" onclick="window.handleYesNo('yes', ${step})">${q.yesLabel}</button>`;
                if (isNoLocked) {
                    html += `<button class="btn btn-locked" onclick="window.handleLocked('${q.lockType}', ${step})">${q.noLabel}</button>`;
                } else {
                    html += `<button class="btn btn-no" onclick="window.handleYesNo('no', ${step})">${q.noLabel}</button>`;
                }
                html += `</div>`;
            } 
            else if (q.type === 'twoOptions') {
                html += `<div class="btn-group">`;
                html += `<button class="btn btn-yes" onclick="window.handleTwoOptions('opt1', ${step})">${q.opt1}</button>`;
                html += `<button class="btn btn-locked" onclick="window.handleLocked('${q.lockType}', ${step})">${q.opt2}</button>`;
                html += `</div>`;
            }
            else if (q.type === 'multiSelect') {
                html += `<div class="btn-group" style="flex-wrap:wrap;">`;
                q.options.forEach((label, idx) => {
                    if (idx === q.activeIndex) {
                        html += `<button class="btn btn-yes" style="background:#2196f3; box-shadow:0 0 25px #2196f3aa; border-color:#64b5f6;" onclick="window.handleMultiSelect(${idx}, ${step})">${label}</button>`;
                    } else {
                        html += `<button class="btn btn-locked" onclick="window.handleLocked('${q.lockType}', ${step})">${label}</button>`;
                    }
                });
                html += `</div>`;
            }
            else if (q.type === 'datePicker') {
                html += `<div class="btn-group">`;
                html += `<button class="btn btn-locked" style="opacity:0.4; cursor:default;" onclick="window.handleDatePicker('man', ${step})">${q.option1} 🔒</button>`;
                html += `<button class="btn btn-yes" style="background:#ab47bc; box-shadow:0 0 25px #ab47bc88; border-color:#ce93d8;" onclick="window.handleDatePicker('to', ${step})">${q.option2}</button>`;
                html += `</div>`;
            }

            contentEl.innerHTML = html;
        }

        // === مدیریت کلیک‌ها ===
        window.handleYesNo = function(choice, step) {
            if (step === 0) {
                if (choice === 'yes') {
                    state.answers.push('بله');
                    state.currentStep = 1;
                    renderQuestion(1);
                    showBigHeart();
                } else {
                    state.noClickCount = (state.noClickCount || 0) + 1;
                    let msg = '';
                    if (state.noClickCount === 1) msg = '❌ غلط کردی دختر خانم 😤';
                    else if (state.noClickCount === 2) msg = '😐💔 داری اذیتم میکنیاااا';
                    else if (state.noClickCount === 3) msg = '😒 اگه نظرت اینه باید ۶۰ میلیارد پرداخت کنی برای اشتراک خیر گفتن';
                    else {
                        state.noClickCount = 1;
                        msg = '❌ غلط کردی دختر خانم 😤';
                    }
                    showPopup(msg);
                }
            } 
            else if (step === 2) {
                if (choice === 'yes') {
                    state.answers.push('بله (دیت)');
                    state.currentStep = 3;
                    renderQuestion(3);
                }
            }
        };

        window.handleLocked = function(lockType, step) {
            let msg = '';
            let count = 0;

            switch(lockType) {
                case 'no':
                    state.noClickCount = (state.noClickCount || 0) + 1;
                    count = state.noClickCount;
                    if (count === 1) msg = '❌ غلط کردی دختر خانم 😤';
                    else if (count === 2) msg = '😐💔 داری اذیتم میکنیاااا';
                    else if (count === 3) msg = '😒 اگه نظرت اینه باید ۶۰ میلیارد پرداخت کنی برای اشتراک خیر گفتن';
                    else { state.noClickCount = 1; msg = '❌ غلط کردی دختر خانم 😤'; }
                    break;

                case 'wedding':
                    state.weddingLockCount = (state.weddingLockCount || 0) + 1;
                    count = state.weddingLockCount;
                    if (count === 1) msg = '🙄 نه ماه عسل فقط عشقه';
                    else if (count === 2) msg = 'جیش میکنمااااا😅';
                    else if (count === 3) msg = 'عییی بابااااااااااااا چراا اینقدد اینو میزنیاااا 💸';
                    else { state.weddingLockCount = 1; msg = '🙄 نه ماه عسل فقط عشقه'; }
                    break;

                case 'date':
                    state.dateLockCount = (state.dateLockCount || 0) + 1;
                    count = state.dateLockCount;
                    if (count === 1) msg = 'زوریه!! 😤';
                    else if (count === 2) msg = 'زوریه!!!!! 😤';
                    else if (count === 3) msg = 'زوریه!!!!!!!! 😤';
                    else { state.dateLockCount = 1; msg = 'زوریه!! 😤'; }
                    break;

                case 'food':
                    msg = '🚫 اینترنت متصل نیست فقط برای آب متصل است 🚰';
                    break;

                case 'place':
                    msg = '🚶 پیاده برای سلامتیت بهتره ها 🫠🙂';
                    break;

                case 'datepicker':
                    return;

                default:
                    msg = '🔒 این گزینه قفل است!';
            }

            if (msg) showPopup(msg);
        };

        window.handleTwoOptions = function(choice, step) {
            if (step === 1) {
                if (choice === 'opt1') {
                    state.answers.push('ماه عسل');
                    state.currentStep = 2;
                    renderQuestion(2);
                }
            }
        };

        window.handleMultiSelect = function(idx, step) {
            const q = questions[step];
            if (idx === q.activeIndex) {
                if (step === 3) state.answers.push('آب 🚰');
                else if (step === 4) state.answers.push('پیاده روی توی پارک 🌳');
                state.currentStep = step + 1;
                renderQuestion(state.currentStep);
            }
        };

        window.handleDatePicker = function(choice, step) {
            if (choice === 'to') {
                state.answers.push('تو انتخاب کنی 🌸');
                state.currentStep = 6;
                renderFinal();
            }
        };

        // === پاپ‌آپ ===
        function showPopup(text) {
            const old = document.querySelector('.popup-overlay');
            if (old) old.remove();

            const overlay = document.createElement('div');
            overlay.className = 'popup-overlay';
            overlay.innerHTML = `
                <div class="popup-card">
                    <div style="font-size:2.5rem; margin-bottom:10px;">💔</div>
                    <div style="line-height:1.7;">${text}</div>
                    <button class="close-btn" onclick="this.closest('.popup-overlay').remove();">برگشت 🔙</button>
                </div>
            `;
            document.body.appendChild(overlay);
        }

        // === قلب بزرگ ===
        window.showBigHeart = function() {
            const heartDiv = document.createElement('div');
            heartDiv.style.position = 'fixed';
            heartDiv.style.top = '0';
            heartDiv.style.left = '0';
            heartDiv.style.width = '100%';
            heartDiv.style.height = '100%';
            heartDiv.style.background = 'rgba(0,0,0,0.5)';
            heartDiv.style.backdropFilter = 'blur(4px)';
            heartDiv.style.display = 'flex';
            heartDiv.style.justifyContent = 'center';
            heartDiv.style.alignItems = 'center';
            heartDiv.style.zIndex = '1000';
            heartDiv.innerHTML = `<div style="font-size:7rem; animation:heartBeat 0.6s infinite alternate; text-shadow:0 0 60px #ff0044;">❤️</div>`;
            document.body.appendChild(heartDiv);
            setTimeout(() => {
                heartDiv.remove();
            }, 1200);
        };

        // === صفحه عکس و پیام عاشقانه ===
        function showPhotoPage() {
            contentEl.innerHTML = `
                <div class="photo-page">
                    <div class="photo-frame">
                        <span class="heart-decoration">❤️</span>
                        <span class="heart-decoration">💖</span>
                        <span class="heart-decoration">❤️</span>
                        <span class="heart-decoration">💕</span>
                        <span class="heart-decoration">❤️</span>
                        <img src="https://raw.githubusercontent.com/IRANCYB/IRANCYB.GITHUB.IO/main/IMG_20260823_145154_720.jpg" 
                             alt="عکس عاشقانه" 
                             onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                        <div style="display:none; color:#ff3366; font-size:1.2rem; padding:40px 20px; background:#1a0b1a; border-radius:16px;">
                            عکس در دسترس نیست ❤️<br>
                            <span style="font-size:0.8rem; color:#885566;">لطفاً جهت دیدن عکس اینترنت را چک کنید</span>
                        </div>
                    </div>
                    <div class="love-message">
                        <span class="highlight"> 
                              «یک عمر را با تو بودن را به تمام عمرهای این جهان در تنهایی ترجیح میدم.» </span>
                    </div>
                    <button class="btn-back" onclick="window.renderFinal()" style="margin-top:20px;">🔙 برگشت به صفحه اصلی</button>
                </div>
            `;
        }

        // === مرحله نهایی ===
        window.renderFinal = function() {
            contentEl.innerHTML = `
                <div class="final-section">
                    <div style="text-align:center;">
                        <div class="money-emoji">💰💵</div>
                        <div style="font-size:1.7rem; color:#ffaa33; text-shadow:0 0 25px #ffaa33; font-weight:800;"> تبریک! هزینه دیت را پرداخت کنید 🤭🎉</div>
                        <div class="strike-line">۱ میلیون</div>
                        <div class="big-green">۲ میلیون</div>
                        <div style="margin:18px 0; color:#ff99bb; font-size:0.95rem; opacity:0.8;">✨ پاسخ‌های شما: ${state.answers.join(' - ')} ✨</div>
                        <button class="btn-must-read" onclick="window.showPhotoPage()">📖 این رو حتما بخون ❤️</button>
                    </div>
                </div>
            `;
        };

        // نمایش صفحه عکس (از دکمه)
        window.showPhotoPage = showPhotoPage;

        // === شروع ===
        window.onload = function() {
            renderQuestion(0);
        };

        console.log('💖 عشق آغاز شد 💖');
    })();
</script>

</body>
</html>
